<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanAgro - Fertilizer E-Commerce & AI Plant Doctor</title>
    <meta name="description" content="E-Commerce store for agricultural fertilizers, bio-nutrients, and multilingual AI plant disease diagnostics in Telugu, Kannada, Hindi, and English." />
    <script>
      // Apply the saved theme before first paint so dark mode does not flash light
      (function () {
        try {
          var stored = localStorage.getItem('kisan_theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
